name: Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Install dependencies
      run: |
        uv pip install --system -e .[dev]

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install JupyterLab extension dependencies
      working-directory: instrmcp/extensions/jupyterlab
      # yarn.lock is gitignored repo-wide, and jlpm (Yarn 3) refuses to create
      # a lockfile when CI=true. Allow it here so the install can proceed.
      run: jlpm install --no-immutable

    - name: Run JupyterLab policy tests
      working-directory: instrmcp/extensions/jupyterlab
      run: jlpm test:policy

    - name: Run Black (formatting check)
      run: |
        black --check instrmcp/ tests/

    - name: Run Flake8 (linting)
      run: |
        flake8 instrmcp/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics --extend-ignore=F824
        flake8 instrmcp/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --extend-ignore=F824

    - name: Run MyPy (type checking)
      run: |
        mypy instrmcp/ --ignore-missing-imports
      continue-on-error: true
